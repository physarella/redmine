  /search.json:
    get:
      tags:
      - Search
      externalDocs:
        url: https://www.redmine.org/projects/redmine/wiki/Rest_Search#GET
      summary: Pesquisar
      description: 'Runs a full-text search over Redmine content and returns paginated results.'
      operationId: search
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/nometa'
      - $ref: '#/components/parameters/x_redmine_switch_user'
      - $ref: '#/components/parameters/x_redmine_nometa'
      - name: q
        in: query
        schema:
          type: string
        required: true
        description: 'Search terms. Separate multiple words with spaces.'
      - name: scope
        in: query
        schema:
          type: string
          enum:
          - all
          - my_project
          - subprojects
        description: 'Search scope: "all" (all projects), "my_project" (the user''s projects) or "subprojects". If the value is not in the request or the context, do not ask the user; omit this parameter.'
        required: false
      - name: all_words
        in: query
        schema:
          type: integer
          enum:
          - 1
          default: 1
        description: '1 to require all terms to match; 0 otherwise. If the value is not in the request or the context, do not ask the user; omit this parameter.'
        required: false
      - name: titles_only
        in: query
        schema:
          type: integer
          enum:
          - 1
        description: '1 to search titles only; 0 to also search the content. Useful to find a project by name. If the value is not in the request or the context, do not ask the user; omit this parameter.'
        required: false
      - name: issues
        in: query
        schema:
          type: integer
          enum:
          - 1
        description: '1 to include issues in the results. If the value is not in the request or the context, do not ask the user; omit this parameter.'
        required: false
      - name: news
        in: query
        schema:
          type: integer
          enum:
          - 1
        description: '1 to include news in the results. If the value is not in the request or the context, do not ask the user; omit this parameter.'
        required: false
      - name: wiki_pages
        in: query
        schema:
          type: integer
          enum:
          - 1
        description: '1 to include wiki pages in the results. If the value is not in the request or the context, do not ask the user; omit this parameter.'
        required: false
      - name: projects
        in: query
        schema:
          type: integer
          enum:
          - 1
        description: '1 to include projects in the results. Use projects=1 with titles_only=1 to find a project by name. If the value is not in the request or the context, do not ask the user; omit this parameter.'
        required: false
      - name: documents
        in: query
        schema:
          type: integer
          enum:
          - 1
        description: '1 to include documents in the results. If the value is not in the request or the context, do not ask the user; omit this parameter.'
        required: false
      - name: changesets
        in: query
        schema:
          type: integer
          enum:
          - 1
        description: '1 to include revisions in the results. If the value is not in the request or the context, do not ask the user; omit this parameter.'
        required: false
      - name: messages
        in: query
        schema:
          type: integer
          enum:
          - 1
        description: '1 to include forum messages in the results. If the value is not in the request or the context, do not ask the user; omit this parameter.'
        required: false
      - name: open_issues
        in: query
        schema:
          type: integer
          enum:
          - 1
        description: '1 to search open issues only. If the value is not in the request or the context, do not ask the user; omit this parameter.'
        required: false
      - name: attachments
        in: query
        schema:
          type: string
        description: 'Attachment scope: "0" searches the description only, "1" description and attachments, "only" attachments only. If the value is not in the request or the context, do not ask the user; omit this parameter.'
        required: false
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                required:
                - results
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/search'
                  total_count:
                    type: integer
                  offset:
                    type: integer
                  limit:
                    type: integer
