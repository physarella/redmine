  url: https://www.redmine.org/projects/redmine/wiki/Rest_api
paths:
  /issues.json:
    get:
      tags:
      - Issues
      externalDocs:
        url: https://www.redmine.org/projects/redmine/wiki/Rest_Issues#Listing-issues
      summary: 'List issues'
      description: 'Returns a paginated list of issues, with filters by project, status, assignee and other parameters.'
      operationId: getIssues
      parameters:
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/nometa'
      - $ref: '#/components/parameters/x_redmine_switch_user'
      - $ref: '#/components/parameters/x_redmine_nometa'
      - name: sort
        in: query
        schema:
          type: string
          example: id:desc
        description: 'Sort column. Append ":desc" for descending order and separate multiple columns with commas (e.g. category:desc,updated_on). If the value is not in the request or the context, do not ask the user; omit this parameter.'
        required: false
      - name: include
        in: query
        schema:
          type: string
        description: 'Associated data to include in the response. Separate multiple values with commas. Values: attachments, relations. If the value is not in the request or the context, do not ask the user; omit this parameter.'
        required: false
      - name: issue_id
        in: query
        schema:
          type: string
        description: 'Filters by one or more issues. Separate multiple IDs with commas (e.g. 1,2,3). Also accepts a range with "><" (e.g. ><1|10). If the value is not in the request or the context, do not ask the user; omit this parameter.'
        required: false
      - name: project_id
        in: query
        schema:
          type: string
        description: 'Filters by issues of the given project (numeric ID or identifier). Separate multiple values with "|" (e.g. 1|2|3). Prefix with "!" to negate (e.g. !1|2). If the value is not in the request or the context, do not ask the user; omit this parameter.'
        required: false
      - name: subproject_id
        in: query
        schema:
          type: string
        description: 'Filters by issues of the given subproject. Use "!*" to exclude all subprojects from the result. If the value is not in the request or the context, do not ask the user; omit this parameter.'
        required: false
      - name: tracker_id
        in: query
        schema:
          type: string
        description: 'Filters by tracker. Separate multiple values with "|" (e.g. 1|2|3). Prefix with "!" to negate (e.g. !1|2). If the value is not in the request or the context, do not ask the user; omit this parameter.'
        required: false
      - name: status_id
        in: query
        schema:
          type: string
        description: 'Filters by status. Special values: "open", "closed" or "*" (all). Also accepts a status ID; separate multiple values with "|" (e.g. 1|2|3). If the value is not in the request or the context, do not ask the user; omit this parameter.'
        required: false
      - name: assigned_to_id
        in: query
        schema:
          type: string
        description: 'Filters by assignee, given as a user ID or "me" for your own issues. Separate multiple values with "|". Use "!*" for unassigned issues. If the value is not in the request or the context, do not ask the user; omit this parameter.'
        required: false
      - name: parent_id
        in: query
        schema:
          type: string
        description: 'Filters by subtasks of the given parent issue. Separate multiple values with "|" (e.g. 1|2|3). Prefix with "!" to negate (e.g. !1|2). If the value is not in the request or the context, do not ask the user; omit this parameter.'
        required: false
      - name: cf_x
        in: query
        schema:
          type: string
        description: 'Filters by custom field, in the format cf_ID=value (e.g. cf_1=abcdef). The field must be marked "Used as a filter" in Redmine. If the value is not in the request or the context, do not ask the user; omit this parameter.'
        required: false
      - name: author_id
        in: query
        schema:
          type: string
        description: 'Filters by issue author, given as a user ID or "me". Separate multiple values with "|" (e.g. 1|2|3). Prefix with "!" to negate (e.g. !1|2). If the value is not in the request or the context, do not ask the user; omit this parameter.'
        required: false
      - name: member_of_group
        in: query
        schema:
          type: string
        description: 'Filters by issues assigned to members of the given group. Separate multiple values with "|" (e.g. 1|2|3). Prefix with "!" to negate (e.g. !1|2). If the value is not in the request or the context, do not ask the user; omit this parameter.'
        required: false
      - name: assigned_to_role
        in: query
        schema:
          type: string
        description: 'Filters by issues assigned to users with the given role. Separate multiple values with "|" (e.g. 1|2|3). Prefix with "!" to negate (e.g. !1|2). If the value is not in the request or the context, do not ask the user; omit this parameter.'
        required: false
      - name: fixed_version_id
        in: query
        schema:
          type: string
        description: 'Filters by the associated version (milestone). Separate multiple values with "|" (e.g. 1|2|3). Prefix with "!" to negate (e.g. !1|2). Use "!*" for issues without a version. If the value is not in the request or the context, do not ask the user; omit this parameter.'
        required: false
      - name: fixed_version.due_date
        in: query
        schema:
          type: string
        description: 'Filters by the due date of the associated version. Accepts the operators ">=YYYY-MM-DD" (on or after), "<=YYYY-MM-DD" (on or before) or "><YYYY-MM-DD|YYYY-MM-DD" (range, with the two dates separated by "|"). Also accepts ISO 8601 timestamps (e.g. >=2024-01-02T08:12:32Z). The characters > < = must be URL encoded. If the value is not in the request or the context, do not ask the user; omit this parameter.'
        required: false
      - name: fixed_version.status
        in: query
        schema:
          type: string
        description: 'Filters by the status of the associated version: open, locked or closed. If the value is not in the request or the context, do not ask the user; omit this parameter.'
        required: false
      - name: category_id
        in: query
        schema:
          type: string
        description: 'Filters by issue category. Separate multiple values with "|" (e.g. 1|2|3). Prefix with "!" to negate (e.g. !1|2). Use "!*" for issues without a category. If the value is not in the request or the context, do not ask the user; omit this parameter.'
        required: false
      - name: subject
        in: query
        schema:
          type: string
        description: 'Filters by issue subject. Accepts the operators "~text" (contains), "!~text" (does not contain), "^text" (starts with), "$text" (ends with) or the exact value for a full match. If the value is not in the request or the context, do not ask the user; omit this parameter.'
        required: false
      - name: description
        in: query
        schema:
          type: string
        description: 'Filters by issue description. Accepts the operators "~text" (contains), "!~text" (does not contain), "^text" (starts with), "$text" (ends with) or the exact value for a full match. If the value is not in the request or the context, do not ask the user; omit this parameter.'
        required: false
      - name: notes
        in: query
        schema:
          type: string
        description: 'Filters by the content of the notes. Accepts the operators "~text" (contains), "!~text" (does not contain), "^text" (starts with), "$text" (ends with) or the exact value for a full match. If the value is not in the request or the context, do not ask the user; omit this parameter.'
        required: false
      - name: created_on
        in: query
        schema:
          type: string
        description: 'Filters by creation date. Accepts the operators ">=YYYY-MM-DD" (on or after), "<=YYYY-MM-DD" (on or before) or "><YYYY-MM-DD|YYYY-MM-DD" (range, with the two dates separated by "|"). Also accepts ISO 8601 timestamps (e.g. >=2024-01-02T08:12:32Z). The characters > < = must be URL encoded. If the value is not in the request or the context, do not ask the user; omit this parameter.'
        required: false
      - name: updated_on
        in: query
        schema:
          type: string
        description: 'Filters by last update date. Accepts the operators ">=YYYY-MM-DD" (on or after), "<=YYYY-MM-DD" (on or before) or "><YYYY-MM-DD|YYYY-MM-DD" (range, with the two dates separated by "|"). Also accepts ISO 8601 timestamps (e.g. >=2024-01-02T08:12:32Z). The characters > < = must be URL encoded. If the value is not in the request or the context, do not ask the user; omit this parameter.'
        required: false
      - name: closed_on
        in: query
        schema:
          type: string
        description: 'Filters by closing date. Accepts the operators ">=YYYY-MM-DD" (on or after), "<=YYYY-MM-DD" (on or before) or "><YYYY-MM-DD|YYYY-MM-DD" (range, with the two dates separated by "|"). Also accepts ISO 8601 timestamps (e.g. >=2024-01-02T08:12:32Z). The characters > < = must be URL encoded. If the value is not in the request or the context, do not ask the user; omit this parameter.'
        required: false
      - name: start_date
        in: query
        schema:
          type: string
        description: 'Filters by start date. Accepts the operators ">=YYYY-MM-DD" (on or after), "<=YYYY-MM-DD" (on or before) or "><YYYY-MM-DD|YYYY-MM-DD" (range, with the two dates separated by "|"). Also accepts ISO 8601 timestamps (e.g. >=2024-01-02T08:12:32Z). The characters > < = must be URL encoded. If the value is not in the request or the context, do not ask the user; omit this parameter.'
        required: false
      - name: due_date
        in: query
        schema:
          type: string
        description: 'Filters by due date. Accepts the operators ">=YYYY-MM-DD" (on or after), "<=YYYY-MM-DD" (on or before) or "><YYYY-MM-DD|YYYY-MM-DD" (range, with the two dates separated by "|"). Also accepts ISO 8601 timestamps (e.g. >=2024-01-02T08:12:32Z). The characters > < = must be URL encoded. If the value is not in the request or the context, do not ask the user; omit this parameter.'
        required: false
      - name: estimated_hours
        in: query
        schema:
          type: string
        description: 'Filters by estimated hours. Accepts an exact value or the operators ">=N", "<=N" or "><N|M" (range, values separated by "|"). If the value is not in the request or the context, do not ask the user; omit this parameter.'
        required: false
      - name: spent_time
        in: query
        schema:
          type: string
        description: 'Filters by the total hours spent on the issue. Accepts an exact value or the operators ">=N", "<=N" or "><N|M" (range, values separated by "|"). If the value is not in the request or the context, do not ask the user; omit this parameter.'
        required: false
      - name: done_ratio
        in: query
        schema:
          type: string
        description: 'Filters by done ratio (0 to 100). Accepts an exact value or the operators ">=N", "<=N" or "><N|M" (range, values separated by "|"). If the value is not in the request or the context, do not ask the user; omit this parameter.'
        required: false
      - name: is_private
        in: query
        schema:
          type: string
        description: 'Filters by private issues. Use 1 for private or 0 for public. If the value is not in the request or the context, do not ask the user; omit this parameter.'
        required: false
      - name: attachment
        in: query
        schema:
          type: string
        description: 'Filters by the file name of an issue attachment. Accepts the operators "~text" (contains), "!~text" (does not contain), "^text" (starts with), "$text" (ends with) or the exact value for a full match. If the value is not in the request or the context, do not ask the user; omit this parameter.'
        required: false
      - name: attachment_description
        in: query
        schema:
          type: string
        description: 'Filters by the description of an issue attachment. Accepts the operators "~text" (contains), "!~text" (does not contain), "^text" (starts with), "$text" (ends with) or the exact value for a full match. If the value is not in the request or the context, do not ask the user; omit this parameter.'
        required: false
      - name: watcher_id
        in: query
        schema:
          type: string
        description: 'Filters by issues watched by the given user (ID or "me"). Separate multiple values with "|" (e.g. 1|2|3). Prefix with "!" to negate (e.g. !1|2). If the value is not in the request or the context, do not ask the user; omit this parameter.'
        required: false
      - name: updated_by
        in: query
        schema:
          type: string
        description: 'Filters by issues updated by the given user (ID or "me"). Separate multiple values with "|" (e.g. 1|2|3). Prefix with "!" to negate (e.g. !1|2). If the value is not in the request or the context, do not ask the user; omit this parameter.'
        required: false
      - name: last_updated_by
        in: query
        schema:
          type: string
        description: 'Filters by issues last updated by the given user (ID or "me"). Separate multiple values with "|" (e.g. 1|2|3). Prefix with "!" to negate (e.g. !1|2). If the value is not in the request or the context, do not ask the user; omit this parameter.'
        required: false
      - name: project.status
        in: query
        schema:
          type: integer
        description: 'Filters by the status of the issue''s project: 1 (active), 5 (closed) or 9 (archived). If the value is not in the request or the context, do not ask the user; omit this parameter.'
        required: false
      - name: relation_type
        in: query
        schema:
          type: string
        description: 'Filters by issue relation type (relates, duplicates, duplicated, blocks, blocked, precedes, follows, copied_to, copied_from). If the value is not in the request or the context, do not ask the user; omit this parameter.'
        required: false
      - name: child_id
        in: query
        schema:
          type: string
        description: 'Filters by issues that have the given child issue. Separate multiple values with "|" (e.g. 1|2|3). Prefix with "!" to negate (e.g. !1|2). If the value is not in the request or the context, do not ask the user; omit this parameter.'
        required: false
      - name: query_id
        in: query
        schema:
          type: integer
        description: 'Applies a saved query (preset filter) by its numeric ID. If the value is not in the request or the context, do not ask the user; omit this parameter.'
        required: false
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                required:
                - issues
                properties:
                  issues:
                    type: array
                    items:
                      $ref: '#/components/schemas/issue.simple'
                  total_count:
                    type: integer
                  offset:
                    type: integer
                  limit:
                    type: integer
    post:
      tags:
      - Issues
      externalDocs:
        url: https://www.redmine.org/projects/redmine/wiki/Rest_Issues#Creating-an-issue
      summary: 'Create issue'
      description: 'Creates a new issue in a project with subject, description, tracker, priority and other attributes.'
      operationId: createIssue
      parameters:
      - $ref: '#/components/parameters/x_redmine_switch_user'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - issue
              properties:
                issue:
                  type: object
                  required:
                  - project_id
                  - subject
                  properties:
                    project_id:
                      type: integer
                      description: 'Numeric ID of the project where the issue will be created.'
                    tracker_id:
                      type: integer
                      description: 'Tracker ID (e.g. bug, feature).'
                    status_id:
                      type: integer
                      description: 'Issue status ID (e.g. new, in progress, closed).'
                    priority_id:
                      type: integer
                      description: 'Issue priority ID (e.g. low, normal, high, urgent).'
                    subject:
                      type: string
                      description: 'Issue subject.'
                    description:
                      type: string
                      nullable: true
                      description: 'Detailed issue description, in the text format configured in Redmine (Textile or Markdown).'
                    start_date:
                      type: string
                      format: date
                      nullable: true
                      description: 'Start date, in YYYY-MM-DD format.'
                    due_date:
                      type: string
                      format: date
                      nullable: true
                      description: 'Due date, in YYYY-MM-DD format.'
                    done_ratio:
                      type: integer
                      minimum: 0
                      maximum: 100
                      multipleOf: 10
                      description: 'Done ratio of the issue, from 0 to 100 (in steps of 10).'
                    category_id:
                      type: integer
                      nullable: true
                      description: 'ID of the issue category within the project.'
                    fixed_version_id:
                      type: integer
                      nullable: true
                      description: 'ID of the version (milestone) of the issue.'
                    assigned_to_id:
                      type: integer
                      nullable: true
                      description: 'ID of the user assigned to the issue. Assigning by name is not possible.'
                    parent_issue_id:
                      type: integer
                      nullable: true
                      description: 'Parent issue ID, to create a subtask.'
                    custom_fields:
                      $ref: '#/components/schemas/custom_fields'
                    custom_field_values:
                      $ref: '#/components/schemas/custom_field_values'
                    watcher_user_ids:
                      type: array
                      items:
                        type: integer
                      description: 'IDs of the users to add as watchers of the issue.'
                    is_private:
                      type: boolean
                      description: 'Whether the issue is private (true) or public (false).'
                    estimated_hours:
                      type: number
                      nullable: true
                      description: 'Estimated hours for the issue.'
                    uploads:
                      $ref: '#/components/schemas/uploads'
                  description: 'Object with the issue attributes.'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                type: object
                required:
                - issue
                properties:
                  issue:
                    $ref: '#/components/schemas/issue.simple'
  /issues/{issue_id}.json:
    get:
      tags:
      - Issues
      externalDocs:
        url: https://www.redmine.org/projects/redmine/wiki/Rest_Issues#Showing-an-issue
      summary: 'Show issue'
      description: 'Returns the details of an issue by its ID.'
      operationId: getIssue
      parameters:
      - name: issue_id
        in: path
        required: true
        schema:
          type: integer
        description: 'Numeric ID of the issue.'
      - $ref: '#/components/parameters/x_redmine_switch_user'
      - name: include
        in: query
        schema:
          type: string
        description: 'Associated data to include in the response. Separate multiple values with commas. Values: children, attachments, relations, changesets, journals, watchers, allowed_statuses. If the value is not in the request or the context, do not ask the user; omit this parameter.'
        required: false
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                required:
                - issue
                properties:
                  issue:
                    $ref: '#/components/schemas/issue'
    put:
      tags:
      - Issues
      externalDocs:
        url: https://www.redmine.org/projects/redmine/wiki/Rest_Issues#Updating-an-issue
      summary: 'Update issue'
      description: 'Updates the attributes of an existing issue, such as subject, status, assignee or notes.'
      operationId: updateIssue
      parameters:
      - name: issue_id
        in: path
        required: true
        schema:
          type: integer
        description: 'Numeric ID of the issue.'
      - $ref: '#/components/parameters/x_redmine_switch_user'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                issue:
                  type: object
                  properties:
                    project_id:
                      type: integer
                      description: 'Numeric ID of the project where the issue will be created.'
                    tracker_id:
                      type: integer
                      description: 'Tracker ID (e.g. bug, feature).'
                    status_id:
                      type: integer
                      description: 'Issue status ID (e.g. new, in progress, closed).'
                    priority_id:
                      type: integer
                      description: 'Issue priority ID (e.g. low, normal, high, urgent).'
                    subject:
                      type: string
                      description: 'Issue subject.'
                    description:
                      type: string
                      nullable: true
                      description: 'Detailed issue description, in the text format configured in Redmine (Textile or Markdown).'
                    start_date:
                      type: string
                      format: date
                      nullable: true
                      description: 'Start date, in YYYY-MM-DD format.'
                    due_date:
                      type: string
                      format: date
                      nullable: true
                      description: 'Due date, in YYYY-MM-DD format.'
                    done_ratio:
                      type: integer
                      minimum: 0
                      maximum: 100
                      multipleOf: 10
                      description: 'Done ratio of the issue, from 0 to 100 (in steps of 10).'
                    category_id:
                      type: integer
                      nullable: true
                      description: 'ID of the issue category within the project.'
                    fixed_version_id:
                      type: integer
                      nullable: true
                      description: 'ID of the version (milestone) of the issue.'
                    assigned_to_id:
                      type: integer
                      nullable: true
                      description: 'ID of the user assigned to the issue. Assigning by name is not possible.'
                    parent_issue_id:
                      type: integer
                      nullable: true
                      description: 'Parent issue ID, to create a subtask.'
                    custom_fields:
                      $ref: '#/components/schemas/custom_fields'
                    custom_field_values:
