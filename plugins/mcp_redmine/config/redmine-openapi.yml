                    status:
                      type: integer
                      description: 'User status (1 active, 2 registered, 3 locked).'
                    custom_fields:
                      $ref: '#/components/schemas/custom_fields'
                    custom_field_values:
                      $ref: '#/components/schemas/custom_field_values'
                    group_ids:
                      type: array
                      items:
                        type: integer
                      description: 'IDs of the groups the user belongs to.'
                  description: 'Object with the user attributes.'
                pref:
                  $ref: '#/components/schemas/pref'
      responses:
        '204':
          description: ''
        '422':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
