  /time_entries.json:
    get:
      tags:
      - Time Entries
      externalDocs:
        url: https://www.redmine.org/projects/redmine/wiki/Rest_TimeEntries#Listing-time-entries
      summary: 'List time entries'
      description: 'Returns a paginated list of time entries, with filters.'
      operationId: getTimeEntries
      parameters:
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/nometa'
      - $ref: '#/components/parameters/x_redmine_switch_user'
      - $ref: '#/components/parameters/x_redmine_nometa'
      - name: user_id
        in: query
        schema:
          type: string
        description: 'Filters by time entries of the given user (ID or "me"). Separate multiple values with "|" (e.g. 1|2|3). Prefix with "!" to negate (e.g. !1|2). If the value is not in the request or the context, do not ask the user; omit this parameter.'
        required: false
      - name: project_id
        in: query
        schema:
          type: string
        description: 'Filters by time entries of the given project (numeric ID or identifier). If the value is not in the request or the context, do not ask the user; omit this parameter.'
        required: false
      - name: spent_on
        in: query
        schema:
          type: string
          format: date
        description: 'Filters by time entry date. Accepts the operators ">=YYYY-MM-DD" (on or after), "<=YYYY-MM-DD" (on or before) or "><YYYY-MM-DD|YYYY-MM-DD" (range, with the two dates separated by "|"). Also accepts ISO 8601 timestamps (e.g. >=2024-01-02T08:12:32Z). The characters > < = must be URL encoded. If the value is not in the request or the context, do not ask the user; omit this parameter.'
        required: false
      - name: from
        in: query
        schema:
          type: string
          format: date
        description: 'Start date of the time entry range, in YYYY-MM-DD format. If the value is not in the request or the context, do not ask the user; omit this parameter.'
        required: false
      - name: to
        in: query
        schema:
          type: string
          format: date
        description: 'End date of the time entry range, in YYYY-MM-DD format. If the value is not in the request or the context, do not ask the user; omit this parameter.'
        required: false
      - name: subproject_id
        in: query
        schema:
          type: string
        description: 'Filters by time entries of the given subproject. Use "!*" to exclude subprojects. If the value is not in the request or the context, do not ask the user; omit this parameter.'
        required: false
      - name: issue_id
        in: query
        schema:
          type: string
        description: 'Filters by time entries of the given issue. Separate multiple values with commas. If the value is not in the request or the context, do not ask the user; omit this parameter.'
        required: false
      - name: issue.tracker_id
        in: query
        schema:
          type: string
        description: 'Filters by time entries of issues with the given tracker. Separate multiple values with "|" (e.g. 1|2|3). Prefix with "!" to negate (e.g. !1|2). If the value is not in the request or the context, do not ask the user; omit this parameter.'
        required: false
      - name: issue.status_id
        in: query
        schema:
          type: string
        description: 'Filters by time entries of issues with the given status. Accepts "open", "closed", "*" or IDs separated by "|". If the value is not in the request or the context, do not ask the user; omit this parameter.'
        required: false
      - name: issue.fixed_version_id
        in: query
        schema:
          type: string
        description: 'Filters by time entries of issues in the given version. Separate multiple values with "|" (e.g. 1|2|3). Prefix with "!" to negate (e.g. !1|2). If the value is not in the request or the context, do not ask the user; omit this parameter.'
        required: false
      - name: issue.category_id
        in: query
        schema:
          type: string
        description: 'Filters by time entries of issues in the given category. Separate multiple values with "|" (e.g. 1|2|3). Prefix with "!" to negate (e.g. !1|2). If the value is not in the request or the context, do not ask the user; omit this parameter.'
        required: false
      - name: author_id
        in: query
        schema:
          type: string
        description: 'Filters by time entry author (ID or "me"). Separate multiple values with "|" (e.g. 1|2|3). Prefix with "!" to negate (e.g. !1|2). If the value is not in the request or the context, do not ask the user; omit this parameter.'
        required: false
      - name: activity_id
        in: query
        schema:
          type: string
        description: 'Filters by time entry activity. Separate multiple values with "|" (e.g. 1|2|3). Prefix with "!" to negate (e.g. !1|2). If the value is not in the request or the context, do not ask the user; omit this parameter.'
        required: false
      - name: project.status
        in: query
        schema:
          type: string
        description: 'Filters by project status: 1 (active), 5 (closed) or 9 (archived). If the value is not in the request or the context, do not ask the user; omit this parameter.'
        required: false
      - name: comments
        in: query
        schema:
          type: string
        description: 'Filters by time entry comment. Accepts the operators "~text" (contains), "!~text" (does not contain), "^text" (starts with), "$text" (ends with) or the exact value for a full match. If the value is not in the request or the context, do not ask the user; omit this parameter.'
        required: false
      - name: hours
        in: query
        schema:
          type: string
        description: 'Filters by the hours of the time entry. Accepts an exact value or the operators ">=N", "<=N" or "><N|M" (range, values separated by "|"). If the value is not in the request or the context, do not ask the user; omit this parameter.'
        required: false
      - name: sort
        in: query
        schema:
          type: string
          example: spent_on:desc
        description: 'Sort column. Append ":desc" for descending order (e.g. spent_on:desc). If the value is not in the request or the context, do not ask the user; omit this parameter.'
        required: false
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                required:
                - time_entries
                properties:
                  time_entries:
                    type: array
                    items:
                      $ref: '#/components/schemas/time_entry'
                  total_count:
                    type: integer
                  offset:
                    type: integer
                  limit:
                    type: integer
    post:
      tags:
      - Time Entries
      externalDocs:
        url: https://www.redmine.org/projects/redmine/wiki/Rest_TimeEntries#Creating-a-time-entry
      summary: 'Create time entry'
      description: 'Logs a new time entry on an issue or project.'
      operationId: createTimeEntry
      parameters:
      - $ref: '#/components/parameters/x_redmine_switch_user'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - time_entry
              properties:
                time_entry:
                  type: object
                  required:
                  - hours
                  properties:
                    issue_id:
                      type: integer
                      description: 'ID of the issue the time was spent on. Give issue_id or project_id (at least one).'
                    project_id:
                      type: integer
                      description: 'ID or identifier of the project the time was spent on. Give issue_id or project_id (at least one).'
                    spent_on:
                      type: string
                      format: date
                      description: 'Date of the time entry, in YYYY-MM-DD format (default: today).'
                    hours:
                      type: number
                      description: 'Hours spent.'
                    activity_id:
                      type: integer
                      description: 'Time entry activity ID. Required unless Redmine has a default activity.'
                    comments:
                      type: string
                      description: 'Short comment on the time entry (up to 255 characters).'
                    user_id:
                      type: integer
                      description: 'ID of the user the time is logged for (when logging time on behalf of another user).'
                    custom_fields:
                      $ref: '#/components/schemas/custom_fields'
                    custom_field_values:
                      $ref: '#/components/schemas/custom_field_values'
                  description: 'Object with the time entry attributes.'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                type: object
                required:
                - time_entry
                properties:
                  time_entry:
                    $ref: '#/components/schemas/time_entry'
        '422':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
