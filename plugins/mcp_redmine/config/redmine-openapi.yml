components:
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Redmine-API-Key
    ApiKeyInQueryAuth:
      type: apiKey
      in: query
      name: key
  parameters:
    offset:
      name: offset
      in: query
      schema:
        type: integer
      description: 'Number of records to skip, for pagination. Optional technical control. Never ask the user for this value; omit the parameter unless explicitly needed.'
      required: false
    limit:
      name: limit
      in: query
      schema:
        type: integer
      description: 'Maximum number of records per page (max. 100). Optional technical control. Never ask the user for this value; omit the parameter unless explicitly needed.'
      required: false
    nometa:
      name: nometa
      in: query
      schema:
        type: integer
        enum:
        - 1
      description: 'Omits the pagination metadata in the response. Optional technical control. Never ask the user for this value; omit the parameter unless explicitly needed.'
      required: false
    x_redmine_switch_user:
      name: X-Redmine-Switch-User
      in: header
      schema:
        type: string
        example: jsmith
      description: 'Login of the user to impersonate in the request (requires admin privileges). Optional technical control. Never ask the user for this value; omit the parameter unless explicitly needed.'
      required: false
    x_redmine_nometa:
      name: X-Redmine-Nometa
      in: header
      schema:
        type: integer
        enum:
        - 1
      description: 'Omits the pagination metadata in the response, using a header. Optional technical control. Never ask the user for this value; omit the parameter unless explicitly needed.'
      required: false
    issue_id:
      name: issue_id
      in: path
      required: true
      schema:
        type: integer
      description: 'Numeric ID of the issue.'
    user_id:
      name: user_id
      in: path
      required: true
      schema:
        type: integer
      description: 'Numeric ID of the user.'
    project_id:
      name: project_id
      in: path
      required: true
      schema:
        type: string
      description: 'Numeric ID or identifier of the project (e.g. my-project).'
    membership_id:
      name: membership_id
      in: path
      required: true
      schema:
        type: integer
      description: 'Numeric ID of the membership.'
    time_entry_id:
      name: time_entry_id
      in: path
      required: true
      schema:
        type: integer
      description: 'Numeric ID of the time entry.'
    news_id:
      name: news_id
      in: path
      required: true
      schema:
        type: integer
      description: 'Numeric ID of the news item.'
    issue_relation_id:
      name: issue_relation_id
      in: path
      required: true
      schema:
        type: integer
      description: 'Numeric ID of the issue relation.'
    version_id:
      name: version_id
      in: path
      required: true
      schema:
        type: integer
      description: 'Numeric ID of the version.'
    wiki_page_title:
      name: wiki_page_title
      in: path
      required: true
