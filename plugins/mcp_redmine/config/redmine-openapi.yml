        required: false
      - name: status
        in: query
        schema:
          type: string
        description: 'Filters by project status: 1 (active), 5 (closed) or 9 (archived). If the value is not in the request or the context, do not ask the user; omit this parameter.'
        required: false
      - name: id
        in: query
        schema:
          type: string
        description: 'Filters by one or more projects, given as numeric ID or identifier. Separate multiple values with "|". If the value is not in the request or the context, do not ask the user; omit this parameter.'
        required: false
      - name: name
        in: query
        schema:
          type: string
        description: 'Filters by project name. Accepts the operators "~text" (contains), "!~text" (does not contain), "^text" (starts with), "$text" (ends with) or the exact value for a full match. If the value is not in the request or the context, do not ask the user; omit this parameter.'
        required: false
      - name: description
        in: query
        schema:
          type: string
        description: 'Filters by project description. Accepts the operators "~text" (contains), "!~text" (does not contain), "^text" (starts with), "$text" (ends with) or the exact value for a full match. If the value is not in the request or the context, do not ask the user; omit this parameter.'
        required: false
      - name: parent_id
        in: query
        schema:
          type: string
        description: 'Filters by subprojects of the given parent project. Separate multiple values with "|" (e.g. 1|2|3). Prefix with "!" to negate (e.g. !1|2). If the value is not in the request or the context, do not ask the user; omit this parameter.'
        required: false
      - name: is_public
        in: query
        schema:
          type: string
        description: 'Filters by public projects. Use 1 for public or 0 for private. If the value is not in the request or the context, do not ask the user; omit this parameter.'
        required: false
      - name: created_on
        in: query
        schema:
          type: string
        description: 'Filters by project creation date. Accepts the operators ">=YYYY-MM-DD" (on or after), "<=YYYY-MM-DD" (on or before) or "><YYYY-MM-DD|YYYY-MM-DD" (range, with the two dates separated by "|"). Also accepts ISO 8601 timestamps (e.g. >=2024-01-02T08:12:32Z). The characters > < = must be URL encoded. If the value is not in the request or the context, do not ask the user; omit this parameter.'
        required: false
